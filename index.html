<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HearthPaws has moved</title>
<link rel="canonical" href="https://hearthpaws.github.io/">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=https://hearthpaws.github.io/">
<script>location.replace("https://hearthpaws.github.io/");</script>
<style>
  :root{--cream:#FBF7F0;--ink:#241F1A;--ink-soft:#4A423A;--moss:#33452F;--clay:#C1703F;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--cream);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
       text-align:center;padding:24px}
  .card{max-width:420px}
  .paw{width:56px;height:56px;margin:0 auto 18px;border-radius:16px;background:var(--moss);
       display:flex;align-items:center;justify-content:center;font-size:28px;line-height:1}
  h1{font-family:ui-serif,Georgia,"Times New Roman",Times,serif;font-size:26px;line-height:1.25;
     font-weight:600;margin:0 0 10px}
  p{margin:0 0 18px;color:var(--ink-soft);font-size:16px;line-height:1.5}
  a{display:inline-block;padding:12px 22px;border-radius:999px;background:var(--moss);color:#FBF7F0;
    text-decoration:none;font-weight:600;font-size:15px}
  a:hover{background:#44593E}
  .small{margin-top:16px;font-size:13px;color:#7A6E60}
  .small a{background:none;color:var(--clay);padding:0;font-weight:500;text-decoration:underline}
</style>
</head>
<body>
  <div class="card">
    <div class="paw">🐾</div>
    <h1>HearthPaws has moved</h1>
    <p>The store now lives at its own home. Taking you there&hellip;</p>
    <a href="https://hearthpaws.github.io/">Go to hearthpaws.github.io</a>
    <p class="small">Not moving? <a href="https://hearthpaws.github.io/">hearthpaws.github.io</a></p>
  </div>
</body>
</html>
